<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerno</title>
<meta name="description" content="Kerno: catch falling letters and spell English nouns. A word game for Android.">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14172B; color: #ECEEFF;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 560px; }
  .logo { display: flex; gap: 6px; justify-content: center; }
  .logo span { width: 52px; height: 52px; border-radius: 9px; background: #F3E6C4; color: #2B3166;
               font-weight: 900; font-size: 28px; display: grid; place-items: center; }
  .logo span:first-child { background: #FFB547; }
  p { color: #9AA0C8; line-height: 1.6; }
  a { color: #7C8CFF; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="Kerno"><span>K</span><span>E</span><span>R</span><span>N</span><span>O</span></div>
  <p>Catch falling letters and spell English nouns before the well overflows.<br>
     A word game for Android, coming soon to Google Play.</p>
  <p><a href="privacy/">Privacy policy</a> · <a href="mailto:kerno.game@gmail.com">Contact</a></p>
</main>
</body>
</html>
